<g font-family="PingFang SC, sans-serif">
<text x="48" y="61" font-size="25" fill="#753cf4" font-weight="750">09.28 / 常规榜阅读指南</text>
<text x="48" y="147" font-size="62" fill="#281e39" font-weight="850">今天怎么选</text>
<text x="50" y="203" font-size="27" fill="#756187" font-weight="500">9套主选＋神谕大嘴备选 · 先看装备、来牌和经济</text>
<rect x="42" y="282" width="996" height="232" rx="12" fill="#fff" />
<text x="68" y="339" font-size="35" fill="#281e39" font-weight="800">神谕大嘴，来牌顺再玩</text>
<text x="68" y="400" font-size="28" fill="#281e39" font-weight="500">物理装顺，大嘴与前排来得多，再考虑这条线。</text>
<text x="68" y="456" font-size="26" fill="#756187" font-weight="500">7级先稳两星与前排，来牌多再追大嘴三星。</text>
<rect x="42" y="541" width="996" height="232" rx="12" fill="#fff" />
<text x="68" y="598" font-size="35" fill="#281e39" font-weight="800">地狱火分清轮子和艾希</text>
<text x="68" y="659" font-size="28" fill="#281e39" font-weight="500">轮子拿物理输出装；艾希分支需要地狱火转。</text>
<text x="68" y="715" font-size="26" fill="#756187" font-weight="500">封面63.0%是体系统计，两条分支未分别排强度。</text>
<rect x="42" y="800" width="996" height="232" rx="12" fill="#fff" />
<text x="68" y="857" font-size="35" fill="#281e39" font-weight="800">九五先稳血；低费看数量</text>
<text x="68" y="918" font-size="28" fill="#281e39" font-weight="500">地狱火、巨龙、古纳拉：8级补质量，再考虑上9。</text>
<text x="68" y="974" font-size="26" fill="#756187" font-weight="500">小红先追三；女警、螳螂按来牌走各自的追三路线。</text>
<rect x="42" y="1059" width="996" height="232" rx="12" fill="#fff" />
<text x="68" y="1116" font-size="35" fill="#281e39" font-weight="800">裁决婕拉有转也别硬冲</text>
<text x="68" y="1177" font-size="28" fill="#281e39" font-weight="500">裁决转＋青龙刀＋虚空杖：763样本，前四42.86%。</text>
<text x="68" y="1233" font-size="26" fill="#756187" font-weight="500">这是对应体系内的婕拉三件套分项，有转也别硬冲。</text>
<text x="48" y="1380" font-size="29" fill="#281e39" font-weight="750">图3—11看主选站位；图12看神谕大嘴，十套码见正文。</text>
<rect x="42" y="1430" width="996" height="133" rx="12" fill="#753cf4" />
